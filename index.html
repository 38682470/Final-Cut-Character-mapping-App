<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Relationship Map</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cytoscape.js for graph rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <!-- Top Toolbar -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center space-x-6">
            <h1 class="text-xl font-bold text-gray-800">Relationship Map</h1>
            <div class="flex items-center space-x-2 text-sm text-gray-600">
                <span>Relationship Length:</span>
                <input type="range" id="edgeLengthSlider" min="50" max="300" value="150" class="w-28 cursor-pointer">
            </div>
            <span id="statsLabel" class="text-xs font-medium bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full">0 characters, 0 relationships</span>
            <button id="clearSelectionBtn" class="text-xs text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded transition">Clear Selection</button>
        </div>
        <div class="flex items-center space-x-3">
            <button id="exportJsonBtn" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm px-4 py-2 rounded-lg font-medium shadow-sm transition">Export JSON</button>
            <label class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium shadow-sm cursor-pointer transition">
                Import JSON
                <input type="file" id="importJsonInput" accept=".json" class="hidden">
            </label>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Canvas Graph Area -->
        <div id="cy" class="flex-1 bg-slate-50 relative"></div>

        <!-- Right Control Panel -->
        <aside class="w-96 bg-white border-l border-gray-200 flex flex-col shadow-lg z-10">
            <div id="panelContent" class="flex-1 overflow-y-auto p-6">
                <!-- Dynamic content injected via app.js -->
                <div class="text-center py-12 text-gray-500">
                    <p class="text-sm">Select a character or click below to add a new one.</p>
                    <button id="addCharacterInitialBtn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium shadow transition">+ Add Character</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
